<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Library</title>
<style>
  :root {
    --bg: #111214; --panel: #1b1d21; --line: #2a2d33; --text: #e6e6e6;
    --muted: #9a9ea6; --accent: #e0a04a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* Keep content clear of the notch in landscape on iPhone. */
  body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }

  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .back { padding: 6px 10px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }

  /* Library */
  .search { width: 100%; padding: 10px 12px; margin-bottom: 16px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px;
    background: var(--panel); display: block; }
  .card .t { margin-top: 6px; font-weight: 600; line-height: 1.3; }
  .card .m { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .section-title { font-size: 19px; margin: 8px 0 14px; }
  .section + .section { margin-top: 34px; }
  .card .meter { height: 3px; margin-top: 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .card .meter span { display: block; height: 100%; background: var(--accent); }

  /* Book */
  .book-top { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; }
  .book-top img { width: 140px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; }
  .book-top .info { flex: 1; min-width: 200px; }
  .book-top h2 { margin: 0 0 6px; }
  .book-top .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chapters { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .chapters li a { display: flex; justify-content: space-between; gap: 12px; padding: 11px 4px;
    border-bottom: 1px solid var(--line); }
  .chapters li a:hover { background: var(--panel); }
  .chapters .n { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .chapters li.current a { color: var(--accent); }

  /* Reader */
  body.reading header { transition: transform .2s; }
  body.reading.hide-ui header, body.reading.hide-ui .bar { transform: translateY(-100%); }
  body.reading.hide-ui .bar { transform: translateY(100%); }
  .pages { max-width: 900px; margin: 0 auto; }
  .pages img { display: block; width: 100%; height: auto; min-height: 40vh; background: var(--panel); }
  .pages img.loaded { min-height: 0; background: none; }
  /* Pages with known dimensions reserve their exact height, so loading doesn't move the layout. */
  .pages img.sized { min-height: 0; }
  .chapter-end { display: flex; justify-content: center; gap: 10px; padding: 30px 16px 90px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center;
    gap: 8px; padding: 10px calc(16px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom))
    calc(16px + env(safe-area-inset-left));
    background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line); transition: transform .2s; }
  .bar .pos { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar select { flex: 1; min-width: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px; font: inherit; text-overflow: ellipsis; }
  .bar button { white-space: nowrap; }
  /* On phones, Prev and Next shrink to arrows so the chapter picker gets the room. */
  @media (max-width: 560px) {
    .bar { gap: 6px; }
    .bar button { padding: 8px 12px; }
    .bar .label { display: none; }
  }
</style>
</head>
<body>
<header>
  <a class="back" id="back" hidden><button class="back">‹</button></a>
  <h1 id="title">Library</h1>
</header>
<main id="app"></main>

<script>
const app = document.getElementById("app");
const titleEl = document.getElementById("title");
const backEl = document.getElementById("back");
const enc = encodeURIComponent;
const img = p => `/img?p=${enc(p)}`;
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let cleanup = () => {};
// Each navigation gets a number. A view whose number is no longer current stops
// at its next await, so a slow response can't overwrite a newer page.
let navId = 0;

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function setHeader(title, backHref) {
  titleEl.textContent = title;
  document.title = title === "Library" ? "Library" : `${title} · Library`;
  backEl.hidden = !backHref;
  if (backHref) backEl.href = backHref;
}
// Chapter folders often start with "0001 - "; drop that prefix for display.
const chapterLabel = name => name.replace(/^\d+\s*-\s*/, "");

/* ---------- Library ---------- */
async function showLibrary(isCurrent) {
  setHeader("Library");
  const books = await api("/api/books");
  if (!isCurrent()) return;
  if (!books.length) { app.innerHTML = `<p class="empty">No books found.</p>`; return; }
  // Books with saved progress, most recently read first.
  const reading = books.filter(b => b.progress).sort((a, b) => b.progress.time - a.progress.time);
  const cover = b => `<img loading="lazy" src="${b.cover ? img(b.cover) : ""}" alt="">`;
  const continueCard = b => {
    const p = b.progress;
    const pct = Math.round(((p.chapter + 1) / b.chapters) * 100);
    return `<a class="card" href="#/read/${enc(b.id)}/${p.chapter}/${p.page}">
      ${cover(b)}<div class="meter"><span style="width:${pct}%"></span></div>
      <div class="t">${esc(b.title)}</div>
      <div class="m">Chapter ${p.chapter + 1} of ${b.chapters} · page ${p.page + 1}</div></a>`;
  };
  const libraryCard = b => `<a class="card" href="#/book/${enc(b.id)}">
      ${cover(b)}<div class="t">${esc(b.title)}</div><div class="m">${b.chapters} chapters</div></a>`;

  const q = store.get("search", "");
  app.innerHTML = `
    ${reading.length ? `<section class="section">
      <h2 class="section-title">Continue reading</h2>
      <div class="grid">${reading.map(continueCard).join("")}</div>
    </section>` : ""}
    <section class="section">
      <h2 class="section-title">Library</h2>
      <input class="search" placeholder="Search ${books.length} books" value="${esc(q)}">
      <div class="grid" id="libraryGrid"></div>
    </section>`;
  const grid = app.querySelector("#libraryGrid");
  const input = app.querySelector(".search");
  const render = () => {
    const term = input.value.trim().toLowerCase();
    store.set("search", input.value);
    grid.innerHTML = books.filter(b => b.title.toLowerCase().includes(term)).map(libraryCard).join("")
      || `<p class="empty">No matches.</p>`;
  };
  input.oninput = render;
  render();
}

/* ---------- Book ---------- */
async function showBook(id, isCurrent) {
  const b = await api(`/api/book?id=${enc(id)}`);
  if (!isCurrent()) return;
  setHeader(b.title, "#/");
  const p = b.progress;
  const first = b.chapters[0];
  app.innerHTML = `
    <div class="book-top">
      <img alt="" id="cover">
      <div class="info">
        <h2>${esc(b.title)}</h2>
        <div class="m">${b.chapters.length} chapters · ${b.chapters.reduce((s, c) => s + c.pages, 0)} pages</div>
        <div class="actions">
          ${p ? `<a href="#/read/${enc(id)}/${p.chapter}/${p.page}"><button class="primary">
            Continue: ${esc(chapterLabel(b.chapters[p.chapter]?.name ?? ""))}</button></a>` : ""}
          <a href="#/read/${enc(id)}/0"><button ${p ? "" : 'class="primary"'}>Start from the beginning</button></a>
        </div>
      </div>
    </div>
    <ul class="chapters">${b.chapters.map((c, i) => `
      <li class="${p && p.chapter === i ? "current" : ""}"><a href="#/read/${enc(id)}/${i}">
        <span>${esc(chapterLabel(c.name))}</span><span class="n">${c.pages} pages</span></a></li>`).join("")}
    </ul>`;
  // Cover: first page of the first chapter.
  api(`/api/chapter?book=${enc(id)}&ch=0`).then(c => {
    if (isCurrent() && c.pages[0]) document.getElementById("cover").src = img(c.pages[0]);
  }).catch(() => {});
  app.querySelector(".current")?.scrollIntoView({ block: "center" });
}

/* ---------- Reader ---------- */
async function showReader(id, chIdx, startPage, isCurrent) {
  const [c, book] = await Promise.all([
    api(`/api/chapter?book=${enc(id)}&ch=${chIdx}`),
    api(`/api/book?id=${enc(id)}`),
  ]);
  if (!isCurrent()) return;
  setHeader(`${c.title} · ${chapterLabel(c.name)}`, `#/book/${enc(id)}`);
  document.body.classList.add("reading");

  let page = Math.max(0, Math.min(startPage || 0, c.pages.length - 1));
  const hasPrev = chIdx > 0, hasNext = chIdx < c.total - 1;
  const goChapter = i => location.hash = `#/read/${enc(id)}/${i}`;

  // Saves are debounced; flush() sends a pending save right away. keepalive lets
  // the request finish even when the page is closing.
  let saveTimer, pending = false;
  const flush = () => {
    clearTimeout(saveTimer);
    if (!pending) return;
    pending = false;
    fetch("/api/progress", {
      method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
      body: JSON.stringify({ book: id, chapter: chIdx, page }),
    }).catch(() => {});
  };
  const save = () => {
    pending = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 600);
  };
  const onHide = () => { if (document.visibilityState === "hidden") flush(); };

  const options = book.chapters.map((ch, i) =>
    `<option value="${i}" ${i === chIdx ? "selected" : ""}>${esc(chapterLabel(ch.name))}</option>`).join("");
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.innerHTML = `<button id="prevCh" aria-label="Previous chapter" ${hasPrev ? "" : "disabled"}>‹<span class="label"> Prev</span></button>
    <select id="chSel" aria-label="Chapter">${options}</select>
    <span class="pos" id="pos"></span>
    <button id="nextCh" aria-label="Next chapter" ${hasNext ? "" : "disabled"}><span class="label">Next </span>›</button>`;
  document.body.appendChild(bar);
  bar.querySelector("#prevCh").onclick = () => hasPrev && goChapter(chIdx - 1);
  bar.querySelector("#nextCh").onclick = () => hasNext && goChapter(chIdx + 1);
  bar.querySelector("#chSel").onchange = e => goChapter(+e.target.value);
  const pos = bar.querySelector("#pos");
  const showPos = () => pos.textContent = `${page + 1} / ${c.pages.length}`;

  const sizeAttrs = i => {
    const s = c.sizes?.[i];
    return s ? `width="${+s[0]}" height="${+s[1]}" class="sized"` : "";
  };
  app.innerHTML = `<div class="pages">${c.pages.map((p, i) =>
    `<img data-i="${i}" ${sizeAttrs(i)} ${i < 3 ? `src="${img(p)}"` : `data-src="${img(p)}"`} alt="Page ${i + 1}">`).join("")}</div>
    <div class="chapter-end">
      ${hasNext ? `<button class="primary" id="endNext">Next chapter ›</button>`
                : `<button id="endBack">Finished · back to book</button>`}</div>`;
  app.querySelector("#endNext")?.addEventListener("click", () => goChapter(chIdx + 1));
  app.querySelector("#endBack")?.addEventListener("click", () => location.hash = `#/book/${enc(id)}`);

  const imgs = [...app.querySelectorAll(".pages img")];
  const load = el => { if (el.dataset.src) { el.src = el.dataset.src; delete el.dataset.src; } };
  imgs.forEach(el => el.onload = () => el.classList.add("loaded"));
  // Load images a couple of screens ahead.
  const loader = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { load(e.target); loader.unobserve(e.target); }
  }), { rootMargin: "200% 0px" });
  // Track the page in the middle of the screen.
  const tracker = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { page = +e.target.dataset.i; showPos(); save(); }
  }), { rootMargin: "-40% 0px -59% 0px" });
  imgs.forEach(el => loader.observe(el));
  showPos();

  // Hide the header and bar while scrolling down; show them when scrolling up.
  let lastY = scrollY;
  const onScroll = () => {
    document.body.classList.toggle("hide-ui", scrollY > lastY && scrollY > 80);
    lastY = scrollY;
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", onHide);

  cleanup = () => {
    flush();
    loader.disconnect(); tracker.disconnect();
    window.removeEventListener("scroll", onScroll);
    window.removeEventListener("pagehide", flush);
    document.removeEventListener("visibilitychange", onHide);
    bar.remove();
    document.body.classList.remove("reading", "hide-ui");
  };

  if (page > 0) {
    // Pages with known sizes already hold their final height. Any page above the
    // saved one without a size would change height when it loads, so wait for
    // those before scrolling. Tracking starts only after that, so a displaced
    // position is never saved.
    const unsized = imgs.slice(0, page).filter(el => !el.classList.contains("sized"));
    unsized.forEach(load);
    const settled = el => el.complete ? Promise.resolve() : new Promise(r => {
      el.addEventListener("load", r, { once: true });
      el.addEventListener("error", r, { once: true });
    });
    await Promise.all(unsized.map(settled));
    if (!isCurrent()) return;
    imgs[page].scrollIntoView();
  } else window.scrollTo(0, 0);
  imgs.forEach(el => tracker.observe(el));
}

/* ---------- Router ---------- */
async function route() {
  cleanup(); cleanup = () => {};
  const nav = ++navId;
  const isCurrent = () => nav === navId;
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  try {
    if (parts[0] === "book" && parts[1]) await showBook(parts[1], isCurrent);
    else if (parts[0] === "read" && parts[1]) await showReader(parts[1], +parts[2] || 0, +parts[3] || 0, isCurrent);
    else await showLibrary(isCurrent);
  } catch (e) {
    if (!isCurrent()) return;
    app.innerHTML = `<p class="empty">Couldn't load this page (${esc(e.message)}). <a href="#/">Back to library</a></p>`;
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
